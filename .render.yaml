services:
  - type: web
    name: intelligent-scraper
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MODEL_URL
        value: https://huggingface.co/QuantLLM/SmolLM2-135M-GGUF/resolve/main/SmolLM2-135M-GGUF.Q4_K_M.gguf
      - key: NODE_VERSION
        value: 18.20.0
    disk:
      name: model-cache
      mountPath: /opt/render/project/src/models
      sizeGB: 1
